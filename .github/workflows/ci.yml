name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ──────────────────────────────────────────────
  # Job 1 — lint + static type checks
  # Полная проверка стиля кода (flake8 + pylint)
  # и статический анализ типов (mypy).
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Устанавливаем зависимости из pyproject.toml как единственный источник
          pip install -e ".[test]"
          pip install flake8 pylint mypy types-PyYAML

      - name: Lint — flake8 (полная проверка стиля)
        run: |
          flake8 . --count --select=E9,F63,F7,F82,W,F401,F811 --show-source --statistics

      - name: Lint — pylint (оценка качества кода)
        run: |
          # pylint запускается без || true — job завершится с ошибкой при < 7 баллов
          pylint **/*.py --fail-under=7

      - name: Static type checks — mypy
        run: |
          mypy services/ llm/ config/ api/ --ignore-missing-imports

  # ──────────────────────────────────────────────
  # Job 2 — tests
  # Запускает pytest. Все тесты должны пройти.
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run tests with pytest
        run: |
          pytest tests/ -v --tb=short --junitxml=pytest-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py${{ matrix.python-version }}
          path: pytest-results.xml
          retention-days: 7

  # ──────────────────────────────────────────────
  # Job 3 — build + smoke-test
  # Собирает пакет, устанавливает его и проверяет
  # что main.py доступен через точку входа.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

      - name: Install built package
        run: |
          pip install dist/*.whl

      - name: Smoke test — check module import
        run: |
          python -c "import config; import llm; import services; import api; print('All modules imported successfully')"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
